[project]
name = "feishu-mem"
version = "0.1.0"
description = "feishu longterm agentic memory"
readme = "README.md"
requires-python = ">=3.12.13"
dependencies = [
    "langchain-text-splitters>=1.1.2",
    "lark-oapi>=1.6.5",
    "pybreaker>=1.4.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
markers = [
    "integration: 集成测试，会真实调用 Lark API",
]
